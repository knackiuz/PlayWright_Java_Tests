name: Java Maven Tests CI

on:
  #pull_request:
  #workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    name: Run ${{ matrix.test-group }} tests
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright/java:v1.58.0-noble

    strategy:
      fail-fast: false
      matrix:
        test-group: ["alerts_frame_windows", "elements", "interactions", "widgets"]
    steps:
      - uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Install Playwright browsers with system dependencies
      #- name: Install Playwright Browsers
      #  run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

      - name: Run Tests
        # Ensure your pom.xml is configured for JUnit 5 tags
        run: mvn test -Dgroups="${{ matrix.test-group }}" -Dplaywright.headless=true
        #continue-on-error: true

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.test-group }}
          path: target/allure-results
          retention-days: 1 # Keep temporary results for 1 day

  generate-and-deploy:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: all-results
          merge-multiple: true

      # Simple way to install Allure CLI without manual wget
      - name: Setup Allure
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: all-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history # The action above puts the final report here
